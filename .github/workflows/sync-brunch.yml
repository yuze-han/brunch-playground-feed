name: Sync Brunch feed

on:
  schedule:
    - cron: "17 18 * * *" # 03:17 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-brunch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Check Playground component
        run: |
          npm ci
          npm run build
      - name: Sync public feed
        run: python scripts/sync_brunch.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: sync Brunch feed"
          git push
